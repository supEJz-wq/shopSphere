services:
  - type: web
    name: shopsphere-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_EXPIRES_IN
        value: 7d
      # Replace with your deployed Vercel frontend URL
      - key: CLIENT_URL
        value: http://localhost:5173,https://shop-sphere-8o6she776-errol-3a8a3049.vercel.app
      # Set these two in the Render dashboard (never commit real values)
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
